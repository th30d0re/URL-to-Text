version: "3.9"
services:
  yt-dlp-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TIMEOUT_SEC=30
      - RATE_LIMIT_RPS=2
      - RATE_LIMIT_BURST=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
